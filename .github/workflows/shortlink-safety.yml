name: Bondedlove Unreleased Link Safety
on:
  pull_request:
  push:
    branches:
      - fix/disable-unreleased-store-links-20261121
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/*.test.mjs
